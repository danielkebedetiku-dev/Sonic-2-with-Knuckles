name: Build Sonic.exe ROM

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Lua and build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.3 build-essential

      - name: Build ROM
        run: |
          chmod +x build.lua || true
          chmod -R +x build_tools || true
          find . \( -name "Giovanni Splash Screen.asm" -o -name "Text rendering routines.asm" \) -exec sed -i 's/binclude.*/dc.b 0,0/g' {} +
          lua5.3 build.lua || { cat s2.log 2>/dev/null || true; exit 1; }

      - name: Upload built ROM
        uses: actions/upload-artifact@v4
        with:
          name: Sonic-EXE-ROM
          path: s2built.bin
          if-no-files-found: error
