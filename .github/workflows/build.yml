name: Build Sonic.exe ROM

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Lua and build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.3 build-essential

      - name: Build ROM
        run: |
          chmod +x build.lua || true
          chmod -R +x build_tools || true
          python3 -c '
          import os, re
          for root, _, files in os.walk("."):
              for fn in files:
                  if fn.endswith(".asm"):
                      p = os.path.join(root, fn)
                      txt = open(p, errors="ignore").read()
                      for m in re.findall(r"binclude\s+\x22([^\x22]+)\x22", txt):
                          fp = m.replace("\\", "/")
                          if not os.path.exists(fp):
                              os.makedirs(os.path.dirname(fp) or ".", exist_ok=True)
                              open(fp, "wb").write(b"\x00" * 64)
          '
          lua5.3 build.lua || { cat s2.log 2>/dev/null || true; exit 1; }

      - name: Upload built ROM
        uses: actions/upload-artifact@v4
        with:
          name: Sonic-EXE-ROM
          path: s2built.bin
          if-no-files-found: error
