name: Build Sonic.exe ROM

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Lua and build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.3 build-essential

      - name: Build ROM
        run: |
          chmod +x build.lua || true
          lua5.3 build.lua

      - name: Upload ROM
        uses: actions/upload-artifact@v4
        with:
          name: Sonic-EXE-ROM
          path: "*.bin"
